[package]
name = "android-device-monitor"
version = "0.1.33"
description = "安卓设备监控 - 设备监控工具（Tauri + Rust 重构版）"
authors = ["Hxy"]
edition = "2021"

[lib]
# `_lib` 后缀避免在 Windows 上与 bin 名冲突（见 rust-lang/cargo#8519）
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
base64 = "0.22"
rust_xlsxwriter = "0.95"
zip = "2"
chrono = "0.4"
